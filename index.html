<title>Викторина — Аптечка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500&display=swap">

<style>
/* Layout: single-column quiz card, centered, mobile-first */
:root {
  --bg: #FBF6EE;
  --bg-card: #FFFFFF;
  --fg: #4A3728;
  --fg-muted: #8A7060;
  --accent: #FF6100;
  --accent-light: #FFF0E6;
  --blue: #7BC6FD;
  --blue-light: #EBF6FF;
  --success: #2E9E6B;
  --success-light: #E6F7EF;
  --error: #D64242;
  --error-light: #FDEAEA;
  --border: #EAE0D4;
  --shadow: 0 2px 16px rgba(74,55,40,0.08);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1612;
    --bg-card: #2A2118;
    --fg: #F0E8DF;
    --fg-muted: #A89080;
    --accent: #FF7A2A;
    --accent-light: #2A1A0A;
    --blue: #7BC6FD;
    --blue-light: #0A1A2A;
    --success: #3BB87A;
    --success-light: #0A2018;
    --error: #E05555;
    --error-light: #2A0A0A;
    --border: #3A2E25;
    --shadow: 0 2px 16px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1612;
  --bg-card: #2A2118;
  --fg: #F0E8DF;
  --fg-muted: #A89080;
  --accent: #FF7A2A;
  --accent-light: #2A1A0A;
  --blue: #7BC6FD;
  --blue-light: #0A1A2A;
  --success: #3BB87A;
  --success-light: #0A2018;
  --error: #E05555;
  --error-light: #2A0A0A;
  --border: #3A2E25;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 0 16px;
  padding-block: 24px;
}

.page-wrap {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Header */
.quiz-header {
  text-align: center;
  padding-block: 32px 24px;
}

.quiz-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.logo-img {
  width: 40px;
  height: 40px;
  object-fit: contain;
  flex-shrink: 0;
}

.logo-text {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--fg);
  line-height: 1.2;
  text-align: left;
}

.quiz-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: clamp(22px, 5vw, 28px);
  line-height: 1.2;
  text-wrap: balance;
  color: var(--fg);
  margin: 0 0 8px;
}

.quiz-subtitle {
  color: var(--fg-muted);
  font-size: 14px;
  margin: 0;
}

/* Progress */
.progress-bar {
  background: var(--border);
  border-radius: 100px;
  height: 6px;
  margin-bottom: 24px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 100px;
  transition: width 0.4s ease;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--fg-muted);
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}

/* Card */
.quiz-card {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 28px 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.question-num {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 12px;
}

.question-text {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: clamp(16px, 4vw, 19px);
  line-height: 1.35;
  text-wrap: balance;
  margin: 0 0 24px;
}

/* Options */
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  width: 100%;
  text-align: left;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--fg);
  line-height: 1.4;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--blue);
  background: var(--blue-light);
  transform: translateY(-1px);
}

.option-btn:active:not(:disabled) {
  transform: translateY(0);
}

.option-marker {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Montserrat', sans-serif;
  flex-shrink: 0;
  color: var(--fg-muted);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.option-btn.correct {
  border-color: var(--success);
  background: var(--success-light);
}
.option-btn.correct .option-marker {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

.option-btn.wrong {
  border-color: var(--error);
  background: var(--error-light);
}
.option-btn.wrong .option-marker {
  background: var(--error);
  border-color: var(--error);
  color: #fff;
}

.option-btn:disabled {
  cursor: default;
}

/* Feedback */
.feedback {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  display: none;
  align-items: center;
  gap: 10px;
}

.feedback.show { display: flex; }

.feedback.correct-fb {
  background: var(--success-light);
  color: var(--success);
}

.feedback.wrong-fb {
  background: var(--error-light);
  color: var(--error);
}

.feedback-icon {
  font-size: 18px;
  flex-shrink: 0;
}

/* Next button */
.btn-next {
  margin-top: 20px;
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 15px 24px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  display: none;
  transition: opacity 0.15s, transform 0.1s;
}

.btn-next.show { display: block; }
.btn-next:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-next:active { transform: translateY(0); }

/* Results screen */
.results {
  display: none;
  flex-direction: column;
  gap: 20px;
}

.results.show { display: flex; }

.results-card {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 32px 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  text-align: center;
}

.score-ring-wrap {
  position: relative;
  width: 140px;
  height: 140px;
  margin: 0 auto 20px;
}

.score-ring-wrap svg {
  transform: rotate(-90deg);
}

.score-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.score-num {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 32px;
  line-height: 1;
  color: var(--accent);
}

.score-denom {
  font-size: 13px;
  color: var(--fg-muted);
  margin-top: 2px;
}

.results-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 22px;
  margin: 0 0 8px;
  text-wrap: balance;
}

.results-msg {
  color: var(--fg-muted);
  font-size: 14px;
  margin: 0 0 24px;
  text-wrap: balance;
}

.results-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}

.stat-box {
  background: var(--bg);
  border-radius: 12px;
  padding: 14px 12px;
  border: 1px solid var(--border);
}

.stat-val {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.stat-label {
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 2px;
}

.btn-restart {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 15px 24px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}

.btn-restart:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-restart:active { transform: translateY(0); }

.cta-card {
  background: var(--blue-light);
  border-radius: 16px;
  padding: 20px;
  border: 1px solid var(--blue);
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.cta-icon {
  font-size: 24px;
  flex-shrink: 0;
  margin-top: 2px;
}

.cta-text h3 {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 14px;
  margin: 0 0 4px;
}

.cta-text p {
  font-size: 13px;
  color: var(--fg-muted);
  margin: 0;
}

.cta-text a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

.cta-text a:hover { text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>

  {q:"При ночном крупе — ухудшение началось ещё до полуночи?",a:"Спонгия",opts:["Гепар сульфур","Аконит","Спонгия"]},
  {q:"Кашель/боль резко хуже от движения?",a:"Бриония",opts:["Рус токсикодендрон","Бриония","Симфитум"]},
];

const LABELS = ['А','Б','В'];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestions() {
  questions = shuffle(ALL_QUESTIONS).map(q => ({
    ...q,
    opts: shuffle(q.opts)
  }));
}

function renderQuestion() {
  const total = questions.length;
  const q = questions[current];

  document.getElementById('q-num').textContent = `Вопрос ${current + 1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-text').textContent = `Вопрос ${current + 1} из ${total}`;
  const pct = Math.round((current / total) * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.onclick = () => selectAnswer(btn, opt, q.a);
    btn.innerHTML = `<span class="option-marker">${LABELS[i]}</span><span>${opt}</span>`;
    opts.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  document.getElementById('btn-next').className = 'btn-next';
  answered = false;
}

function selectAnswer(btn, selected, correct) {
  if (answered) return;
  answered = true;

  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => {
    b.disabled = true;
    const label = b.querySelector('span:last-child').textContent;
    if (label === correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  const fbIcon = document.getElementById('fb-icon');
  const fbText = document.getElementById('fb-text');

  if (selected === correct) {
    score++;
    btn.classList.add('correct');
    fb.className = 'feedback show correct-fb';
    fbIcon.textContent = '✓';
    fbText.textContent = 'Верно! Отличная работа.';
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback show wrong-fb';
    fbIcon.textContent = '✗';
    fbText.textContent = `Правильный ответ: ${correct}`;
  }

  const nextBtn = document.getElementById('btn-next');
  nextBtn.className = 'btn-next show';
  if (current === questions.length - 1) {
    nextBtn.textContent = 'Посмотреть результаты →';
  } else {
    nextBtn.textContent = 'Следующий вопрос →';
  }
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-screen').style.display = 'none';
  const res = document.getElementById('results-screen');
  res.className = 'results show';

  const total = questions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('score-num').textContent = score;
  document.getElementById('score-denom').textContent = `из ${total}`;
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-pct').textContent = pct + '%';

  // Ring animation
  const circumference = 2 * Math.PI * 58;
  const arc = document.getElementById('score-arc');
  arc.setAttribute('stroke-dasharray', circumference);
  const offset = circumference * (1 - score / total);
  setTimeout(() => {
    arc.style.transition = 'stroke-dashoffset 1s ease';
    arc.setAttribute('stroke-dashoffset', offset);
  }, 100);

  let title, msg;
  if (pct >= 90) {
    title = 'Отлично! Вы эксперт 🌿';
    msg = 'Вы прекрасно разобрались в гомеопатических препаратах. Ваша аптечка готова к работе!';
  } else if (pct >= 70) {
    title = 'Хороший результат!';
    msg = 'Вы хорошо знаете основные препараты. Немного практики — и станет ещё лучше.';
  } else if (pct >= 50) {
    title = 'Неплохое начало';
    msg = 'Базовые знания есть. Повторите курс и пройдите ещё раз — результат улучшится!';
  } else {
    title = 'Продолжайте учиться';
    msg = 'Материал требует ещё изучения. Вернитесь к урокам курса и попробуйте снова.';
  }

  document.getElementById('res-title').textContent = title;
  document.getElementById('res-msg').textContent = msg;
}

function restartQuiz() {
  score = 0;
  current = 0;
  document.getElementById('results-screen').className = 'results';
  document.getElementById('quiz-screen').style.display = '';
  const arc = document.getElementById('score-arc');
  arc.style.transition = 'none';
  const circumference = 2 * Math.PI * 58;
  arc.setAttribute('stroke-dashoffset', circumference);
  prepareQuestions();
  renderQuestion();
}

prepareQuestions();
renderQuestion();
</script>
